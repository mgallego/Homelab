---
- name: Install NFS client
  apt:
    name: nfs-common
    state: present
    update_cache: yes

- name: Create NFS mount points
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ system_user }}"
    group: "{{ system_user }}"
    mode: "0755"
  loop: "{{ nfs_mounts }}"

- name: Mount NFS shares
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.src }}"
    fstype: nfs
    opts: defaults,nofail
    state: mounted
  loop: "{{ nfs_mounts }}"