---
- name: Install NFS server
  apt:
    name: nfs-kernel-server
    state: present
    update_cache: yes

- name: Write exports file
  template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"

- name: Apply exports
  command: exportfs -ra

- name: Enable and start NFS server
  systemd:
    name: nfs-server
    enabled: yes
    state: started