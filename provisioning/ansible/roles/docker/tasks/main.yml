---
- name: Install prerequisites for Docker repo
  apt:
    name:
      - ca-certificates
      - curl
      - python3-debian
    state: present
    update_cache: yes

- name: Map architecture to Docker naming
  set_fact:
    docker_arch: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' if ansible_facts['architecture'] == 'aarch64' else ansible_facts['architecture'] }}"

- name: Add Docker apt repository (deb822 format)
  deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ docker_arch }}"
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Install Docker packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Configure Docker data-root on M2
  copy:
    content: |
      {
        "data-root": "{{ docker_data_root }}",
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: restart docker

- name: Configure containerd root on M2
  copy:
    content: |
      version = 2
      root = "{{ containerd_root }}"
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
  notify: restart containerd

- name: Enable and start Docker
  systemd:
    name: docker
    enabled: yes
    state: started

- name: Add moises to docker group
  user:
    name: "{{ system_user }}"
    groups: docker
    append: yes

- name: Create docker config directory for system_user
  file:
    path: "/home/{{ system_user }}/.docker"
    state: directory
    owner: "{{ system_user }}"
    group: "{{ system_user }}"
    mode: "0700"

- name: Build docker registry auth entries
  set_fact:
    docker_registry_auths: "{{ docker_registry_auths | default({}) | combine({item.url: {'auth': (item.username + ':' + item.token) | b64encode}}) }}"
  loop: "{{ docker_registries }}"

- name: Write docker registry config for system_user
  copy:
    content: "{{ {'auths': docker_registry_auths} | to_json }}"
    dest: "/home/{{ system_user }}/.docker/config.json"
    owner: "{{ system_user }}"
    group: "{{ system_user }}"
    mode: "0600"