---
- name: Install prerequisites for Docker repo
  apt:
    name:
      - ca-certificates
      - curl
      - python3-debian
    state: present
    update_cache: yes

- name: Map architecture to Docker naming
  set_fact:
    docker_arch: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' if ansible_facts['architecture'] == 'aarch64' else ansible_facts['architecture'] }}"

- name: Add Docker apt repository (deb822 format)
  deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ docker_arch }}"
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Install Docker packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Enable and start Docker
  systemd:
    name: docker
    enabled: yes
    state: started

- name: Add moises to docker group
  user:
    name: "{{ system_user }}"
    groups: docker
    append: yes