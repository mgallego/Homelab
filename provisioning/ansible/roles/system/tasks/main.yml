---
- name: Configure systemd-journald to use RAM
  copy:
    content: |
      [Journal]
      Storage=volatile
      SystemMaxUse=64M
      RuntimeMaxUse=64M
    dest: /etc/systemd/journald.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart journald

- name: Mount apt cache as tmpfs
  ansible.posix.mount:
    path: /var/cache/apt
    src: tmpfs
    fstype: tmpfs
    opts: defaults,noatime
    state: mounted